<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/style.css" rel="stylesheet">
    <link href="/ui/favicon-32.png" rel="icon" type="image/png" sizes="32x32">
    <link href="/ui/favicon-16.png" rel="icon" type="image/png" sizes="16x16">
    <title>Stardew Farmer</title>
  </head>
  <body>
    <div aria-hidden="true" class="pointer-events-none fixed inset-0 -z-10 overflow-hidden [image-rendering:pixelated] [&>img]:absolute">
      <img src="/ui/cloud-6.png" alt="" width="298" height="132" style="top: 3%; left: -2%">
      <img src="/ui/cloud-1.png" alt="" width="336" height="232" style="top: 1%; left: 74%">
      <img src="/ui/cloud-3.png" alt="" width="164" height="92" style="top: 20%; left: 22%">
      <img src="/ui/cloud-4.png" alt="" width="246" height="110" style="top: 26%; left: 86%">
      <img src="/ui/cloud-5.png" alt="" width="128" height="72" style="top: 45%; left: 3%">
      <img src="/ui/cloud-2.png" alt="" width="246" height="164" style="top: 52%; left: 64%">
      <img src="/ui/cloud-6.png" alt="" width="298" height="132" style="top: 70%; left: 30%">
      <img src="/ui/cloud-5.png" alt="" width="128" height="72" style="top: 66%; left: 92%">
      <img src="/ui/cloud-4.png" alt="" width="246" height="110" style="top: 84%; left: 4%">
      <img src="/ui/cloud-3.png" alt="" width="164" height="92" style="top: 88%; left: 72%">
    </div>
    <header>
      <h1 class="px-4 pt-6">
        <img src="/ui/title.png" alt="Stardew Farmer Creator" width="643" height="57" class="mx-auto h-auto max-w-full [image-rendering:pixelated]">
      </h1>
    </header>
    <main class="mx-auto my-8 flex w-fit flex-col items-center gap-6 px-4 xl:flex-row xl:items-start min-[1500px]:w-full min-[1500px]:justify-center min-[1500px]:gap-4">
      <div id="app" class="flex w-fit shrink-0 flex-col gap-6 rounded-xl bg-[#D7A437] p-6"></div>
      <aside id="summary" class="w-full max-w-sm rounded-xl bg-[#D7A437] p-6 empty:hidden xl:sticky xl:top-6 xl:order-first xl:w-80 xl:shrink-0"></aside>
      <aside id="details" class="hidden min-w-0 max-w-sm flex-1 rounded-xl bg-[#D7A437] p-6 min-[1500px]:sticky min-[1500px]:top-6 min-[1500px]:block"></aside>
    </main>
    <footer class="mb-6 px-4 text-center text-xs text-black/70">
      Stardew Valley and its art are © ConcernedApe LLC. Based on Stardew Valley %GAME_VERSION%. This is a non-commercial fan project, not
      affiliated with or endorsed by ConcernedApe. Made with ❤️ by <a href="https://github.com/Daniela17d/stardew-farmer-creator" target="_blank" rel="noopener noreferrer">Daniela Duarte</a> · v%APP_VERSION%
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
