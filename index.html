<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/style.css" rel="stylesheet">
    <title>Stardew Valley Farmer Creator</title>
  </head>
  <body>
    <header>
      <h1 class="px-4 pt-6">
        <canvas id="title" role="img" aria-label="Stardew Valley Farmer Creator" class="mx-auto h-auto max-w-full [image-rendering:pixelated]"></canvas>
      </h1>
    </header>
    <main class="mx-auto my-8 flex w-fit flex-col items-center gap-6 px-4 xl:flex-row xl:items-start min-[1500px]:w-full min-[1500px]:justify-center min-[1500px]:gap-4">
      <div id="app" class="flex w-fit shrink-0 flex-col gap-6 rounded-xl bg-[#D7A437] p-6"></div>
      <aside id="summary" class="w-full max-w-sm rounded-xl bg-[#D7A437] p-6 empty:hidden xl:sticky xl:top-6 xl:order-first xl:w-80 xl:shrink-0"></aside>
      <aside id="details" class="hidden min-w-0 max-w-sm flex-1 rounded-xl bg-[#D7A437] p-6 min-[1500px]:sticky min-[1500px]:top-6 min-[1500px]:block"></aside>
    </main>
    <footer class="mb-6 px-4 text-center text-xs text-black/70">
      Stardew Valley and its art are © ConcernedApe LLC. This is a non-commercial fan project, not
      affiliated with or endorsed by ConcernedApe.
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
